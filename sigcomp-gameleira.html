function Modal({title,onClose,children,wide}){

function Toast({msg,type,onDone}){useEffect(()=>{const t=setTimeout(onDone,3500);return()=>clearTimeout(t);},[]);const cols={success:G,error:'#dc2626',info:'#0369a1',warning:'#d97706'};return <div style={{position:'fixed',bottom:80,left:'50%',transform:'translateX(-50%)',zIndex:300,background:cols[type]||cols.info,color:'#fff',padding:'11px 20px',borderRadius:11,fontWeight:700,fontSize:12,boxShadow:'0 6px 24px rgba(0,0,0,.25)',animation:'fadeUp .3s ease',whiteSpace:'nowrap'}}>{msg}</div>;}

function ARow({a,onDelete}){
  const ext=(a.nome||'').split('.').pop().toLowerCase();
  const ico={pdf:'PDF',doc:'DOC',docx:'DOC',xls:'XLS',xlsx:'XLS',jpg:'IMG',jpeg:'IMG',png:'IMG',zip:'ZIP'}[ext]||'ARQ';
  const cor={PDF:'#dc2626',DOC:'#2563eb',XLS:'#059669',IMG:'#1a3a6e',ZIP:'#d97706',ARQ:'#64748b'}[ico];
  function download(){
    if(a.dataUrl){
      const link=document.createElement('a');
      link.href=a.dataUrl;
      link.download=a.nome;
      link.click();
    } else {
      alert('Arquivo: '+a.nome+'\nTamanho: '+fKB(a.tamanho)+'\n\nPara baixar, o arquivo precisa ser anexado novamente nesta sessão.');
    }
  }
  return <div style={{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'var(--inp)',borderRadius:10,marginBottom:6}}>
    <div style={{width:34,height:34,borderRadius:8,background:cor+'18',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:9,fontWeight:900,color:cor}}>{ico}</span></div>
    <div style={{flex:1,minWidth:0}}>
      <p style={{fontSize:12,fontWeight:700,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{a.nome}</p>
      <p style={{fontSize:10,color:'var(--muted)'}}>{fKB(a.tamanho)} · {fD(a.data)}</p>
    </div>
    <IB icon="dl" color={G} title="Baixar" onClick={download} sm/>
    <IB icon="trash" color="#dc2626" title="Excluir" onClick={()=>onDelete(a.id)} sm/>
  </div>;
}

            {(forn.arquivos||[]).map((arq,ai)=>(
              <div key={arq.id||ai} style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'var(--inp)',border:'1px solid var(--brd)',borderRadius:8,marginBottom:5}}>
                <div style={{width:30,height:30,borderRadius:6,background:'#dc262618',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:8,fontWeight:900,color:'#dc2626'}}>{(arq.nome||'').split('.').pop().toUpperCase().slice(0,4)}</span></div>
                <div style={{flex:1,minWidth:0}}><p style={{fontSize:11,fontWeight:700,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{arq.nome}</p><p style={{fontSize:9,color:'var(--muted)'}}>{fKB(arq.tamanho)}</p></div>
                {arq.dataUrl&&<button onClick={()=>{try{const b64=arq.dataUrl.split(',')[1];const bytes=atob(b64);const arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);const mime=arq.nome.toLowerCase().endsWith('.pdf')?'application/pdf':arq.dataUrl.split(';')[0].split(':')[1]||'application/octet-stream';const blob=new Blob([arr],{type:mime});const url=URL.createObjectURL(blob);window.open(url,'_blank');}catch(e){alert('Não foi possível abrir o arquivo.');}}} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',background:NAVY,color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontSize:10,fontWeight:700,flexShrink:0,whiteSpace:'nowrap'}}><Ic n="eye" z={11} c="#fff"/>Ver</button>}
                {arq.dataUrl&&<button onClick={()=>{const a=document.createElement('a');a.href=arq.dataUrl;a.download=arq.nome;a.click();}} style={{display:'flex',alignItems:'center',gap:4,padding:'4px 10px',background:'#059669',color:'#fff',border:'none',borderRadius:6,cursor:'pointer',fontFamily:'inherit',fontSize:10,fontWeight:700,flexShrink:0,whiteSpace:'nowrap'}}><Ic n="dl" z={11} c="#fff"/>Baixar</button>}
                <IB icon="trash" color="#dc2626" onClick={()=>upForn(forn.id,'arquivos',(forn.arquivos||[]).filter((_,j)=>j!==ai))} sm/>

            <label style={{display:'flex',alignItems:'center',gap:7,padding:'7px 12px',background:GB,border:'1.5px dashed '+GD,borderRadius:8,cursor:'pointer',fontSize:11,fontWeight:700,color:G,width:'fit-content'}}>
              <Ic n="ul" z={14} c={G}/>Anexar orçamento

      <Fld label="Status"><select style={IS} value={f.status} onFocus={oF} onBlur={oB} onChange={e=>up('status',e.target.value)}>{SPQ.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}</select></Fld>
      <Fld label="Observações Gerais"><input style={IS} value={f.obs} onFocus={oF} onBlur={oB} onChange={e=>up('obs',e.target.value)}/></Fld>

function OficioDetail({o,setOficios,onClose,onEdit}){

  function addFiles(files){const reads=files.map(fl=>new Promise(res=>{const r=new FileReader();r.onload=e=>res({id:uid(),nome:fl.name,tamanho:fl.size,data:td(),dataUrl:e.target.result});r.readAsDataURL(fl);}));Promise.all(reads).then(n=>{setAnx(p=>[...p,...n]);setOficios(prev=>prev.map(x=>x.id===o.id?{...x,anexos:[...(x.anexos||[]),...n]}:x));});}
  function delA(id){setAnx(p=>p.filter(a=>a.id!==id));setOficios(prev=>prev.map(x=>x.id===o.id?{...x,anexos:(x.anexos||[]).filter(a=>a.id!==id)}:x));}
  const TABS=[{id:'info',l:'Detalhes',n:'file'},{id:'anexos',l:'Docs ('+anx.length+')',n:'clip'},{id:'hist',l:'Timeline',n:'hist'},{id:'chat',l:'Chat ('+coms.length+')',n:'msg'}];

    {tab==='info'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>{[['Tipo',o.tipo],['Responsável',o.responsavel||'--'],['Data',fD(o.data)],['Prazo',o.prazo?fD(o.prazo):'--'],['Acomp.',o.resp_acomp||'--'],['Secretaria',sec.sigla]].map(([k,v])=><div key={k} style={{background:'var(--inp)',borderRadius:9,padding:'9px 11px'}}><p style={{fontSize:9,color:'var(--muted)',fontWeight:800,textTransform:'uppercase',marginBottom:3}}>{k}</p><p style={{fontSize:12,fontWeight:700,color:over&&k==='Prazo'?'#dc2626':'var(--txt)'}}>{v}</p></div>)}</div>}
    {tab==='anexos'&&<div style={{display:'flex',flexDirection:'column',gap:10}}><div style={{background:GB,border:'1.5px solid '+GD,borderRadius:10,padding:'10px 13px',display:'flex',alignItems:'center',gap:9}}><Ic n="folder" z={15} c={G}/><div><p style={{fontSize:11,fontWeight:700,color:G}}>Pasta: {sec.nome} / {o.numero}</p></div></div><DropZone onFiles={addFiles}/>{anx.length===0&&<p style={{textAlign:'center',color:'var(--muted)',fontSize:12,padding:16}}>Nenhum documento.</p>}{anx.map(a=><ARow key={a.id} a={a} onDelete={delA}/>)}</div>}
    {tab==='hist'&&<div>{(o.historico||[]).slice().reverse().map((h,i)=><div key={i} style={{display:'flex',gap:10,marginBottom:10}}><div style={{width:8,height:8,borderRadius:'50%',background:G,flexShrink:0,marginTop:6}}/><div style={{flex:1,background:'var(--inp)',borderRadius:8,padding:'8px 11px'}}><p style={{fontSize:12,fontWeight:700,color:'var(--txt)'}}>{h.acao}</p><p style={{fontSize:10,color:'var(--muted)'}}>{fD(h.data)} - {h.usuário}</p></div></div>)}</div>}
    {tab==='chat'&&<div><div style={{maxHeight:180,overflowY:'auto',display:'flex',flexDirection:'column',gap:8,marginBottom:12}}>{coms.length===0&&<p style={{textAlign:'center',color:'var(--muted)',fontSize:12,padding:16}}>Sem comentários.</p>}{coms.map((c,i)=><div key={i} style={{background:'var(--inp)',borderRadius:9,padding:'9px 11px'}}><div style={{display:'flex',alignItems:'center',gap:7,marginBottom:4}}><div style={{width:20,height:20,borderRadius:6,background:G+'20',display:'flex',alignItems:'center',justifyContent:'center',color:G,fontWeight:900,fontSize:10}}>{c.usuário.charAt(0)}</div><span style={{fontSize:11,fontWeight:700,color:'var(--txt)'}}>{c.usuário}</span><span style={{fontSize:10,color:'var(--muted)',marginLeft:'auto'}}>{fD(c.data)}</span></div><p style={{fontSize:12,color:'var(--txt)'}}>{c.texto}</p></div>)}</div><div style={{display:'flex',gap:8}}><input style={{...IS,flex:1}} placeholder="Comentario..." value={comment} onChange={e=>setCom(e.target.value)} onFocus={oF} onBlur={oB} onKeyDown={e=>e.key==='Enter'&&sendC()}/><PB onClick={sendC} sm><Ic n="send" z={13}/>Enviar</PB></div></div>}
    <div style={{display:'flex',gap:10,paddingTop:4}}><PB onClick={()=>onEdit(o)} full><Ic n="edit" z={14}/>Editar</PB><PB onClick={onClose} outline>Fechar</PB></div>

function PesquisaDetail({pq,setPesquisas,onClose,onEdit}){
  const[tab,setTab]=useState('info');

    </div>

    {tab==='info'&&<div style={{display:'flex',flexDirection:'column',gap:9}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>{[['Secretaria',sec.nome],['Responsável',pq.responsavel||'--'],['Período',fmtM(pq.periodo)],['Prazo Cotação',pq.prazo_cotacao?fD(pq.prazo_cotacao):'--'],['Ofício Ref.',pq.oficio_ref||'--'],['Fornecedores',(pq.fornecedores||[]).length+' empresa(s)']].map(([k,v])=><div key={k} style={{background:'var(--inp)',borderRadius:9,padding:'9px 11px'}}><p style={{fontSize:9,color:'var(--muted)',fontWeight:800,textTransform:'uppercase',marginBottom:3}}>{k}</p><p style={{fontSize:12,fontWeight:700,color:'var(--txt)'}}>{v}</p></div>)}</div>
      {pq.descricao&&<div style={{background:'var(--inp)',borderRadius:9,padding:'9px 11px'}}><p style={{fontSize:9,color:'var(--muted)',fontWeight:800,textTransform:'uppercase',marginBottom:3}}>Especificações</p><p style={{fontSize:12,color:'var(--txt)',lineHeight:1.6}}>{pq.descricao}</p></div>}
      {venc&&<div style={{background:'#f0fdf4',border:'1.5px solid #86efac',borderRadius:10,padding:'11px 13px'}}><p style={{fontSize:10,color:'#059669',fontWeight:800,textTransform:'uppercase',marginBottom:6}}>Fornecedor com Menor Preço</p><div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}><div><p style={{fontSize:13,fontWeight:800,color:'#065f46'}}>{venc.nome||'--'}</p>{venc.cnpj&&<p style={{fontSize:11,color:'#059669'}}>CNPJ: {venc.cnpj}</p>}</div><p style={{fontSize:18,fontWeight:900,color:'#059669'}}>{fR(venc.valor)}</p></div></div>}

    {tab==='docs'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>

      <DropZone onFiles={addFiles}/>
      {anx.length===0?<p style={{fontSize:12,color:'var(--muted)',textAlign:'center',padding:16}}>Nenhum documento.</p>:anx.map(a=><ARow key={a.id} a={a} onDelete={delA}/>)}
    </div>}
    <div style={{display:'flex',gap:10,paddingTop:4}}><PB onClick={onEdit} full><Ic n="edit" z={14}/>Editar Pesquisa</PB><PB onClick={onClose} outline>Fechar</PB></div>
  </div>;
}

function useClock(){const[now,setNow]=useState(new Date());useEffect(()=>{const t=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(t);},[]);return now;}
function ClockBar(){const now=useClock();const dias=['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sabado'];const meses=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];const dia=dias[now.getDay()];const data=now.getDate()+' de '+meses[now.getMonth()]+' de '+now.getFullYear();const hora=now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});return <div style={{background:'linear-gradient(135deg,#0d3d22,#1a5c38)',borderRadius:14,padding:'12px 20px',display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:10,marginBottom:4}}><div style={{display:'flex',alignItems:'center',gap:12}}><Ic n="clock" z={22} c="rgba(255,255,255,.8)"/><div><p style={{fontSize:11,color:'rgba(255,255,255,.7)',fontWeight:600}}>{dia}</p><p style={{fontSize:14,fontWeight:900,color:'#fff'}}>{data}</p></div></div><div style={{textAlign:'right'}}><p style={{fontSize:28,fontWeight:900,color:'#fff',fontFamily:'monospace',lineHeight:1}}>{hora}</p><p style={{fontSize:10,color:'rgba(255,255,255,.6)',marginTop:2}}>Horário de Brasília</p></div></div>;}
function Dashboard({oficios,processos,pesquisas}){
  const mob=useMob();
  const at=oficios.filter(o=>isOv(o.prazo)&&!['concluido','arquivado'].includes(o.status));
  const venc=oficios.filter(o=>isSn(o.prazo)&&!['concluido','arquivado'].includes(o.status));

  const cards=[
    {l:'Total de Ofícios',v:oficios.length,g:'#1a5c38,#2d8f5e',i:'file'},
    {l:'Pendentes',v:oficios.filter(o=>o.status==='pendente').length,g:'#a07800,#c9a227',i:'alert'},
    {l:'Concluídos',v:oficios.filter(o=>o.status==='concluido').length,g:'#0d3d22,#1a5c38',i:'check'},
    {l:'Processos',v:processos.length,g:'#0d2a4a,#1a3a6e',i:'gavel'},
    {l:'Pesquisas de Preço',v:pesquisas.length,g:'#1a5c38,#22744a',i:'check_sq'},
    {l:'Atrasados',v:at.length,g:'#7a5a00,#c9a227',i:'clock'},
  ];
  const bySec=SECS.map(s=>({...s,n:oficios.filter(o=>o.secretaria_id===s.id).length})).sort((a,b)=>b.n-a.n);
  const mx=Math.max(...bySec.map(s=>s.n),1);
  return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <ClockBar/>

function ProcessoDetail({proc,setProcessos,onClose,onEdit,onSaveContrato}){
  const[tab,setTab]=useState(proc.contrato&&proc.contrato.empresa?'contrato':'info');
  const sec=gS(proc.secretaria_id);
  const st=gT(SPL,proc.status);
  // Contrato state
  const ct=proc.contrato||{};
  const[f,sf]=useState({
    empresa:ct.empresa||'',cnpj:ct.cnpj||'',responsavel:ct.responsavel||'',
    email:ct.email||'',telefone:ct.telefone||'',numero_contrato:ct.numero_contrato||'',
    data_assinatura:ct.data_assinatura||'',data_vigencia:ct.data_vigencia||'',
    objeto:ct.objeto||proc.assunto||'',valor:ct.valor||proc.valor_final||'',
    obs:ct.obs||'',arquivos:ct.arquivos||[],
  });
  const up=(k,v)=>sf(p=>({...p,[k]:v}));
  const fileRef=useRef();
  function pickPDFs(e){
    const files=Array.from(e.target.files);if(!files.length)return;
    const reads=files.map(fl=>new Promise(res=>{const r=new FileReader();r.onload=ev=>res({id:uid(),nome:fl.name,tamanho:fl.size,data:td(),dataUrl:ev.target.result});r.readAsDataURL(fl);}));
    Promise.all(reads).then(novos=>up('arquivos',[...f.arquivos,...novos]));
  }
  function downloadArq(arq){
    if(!arq||!arq.dataUrl)return;
    const a=document.createElement('a');a.href=arq.dataUrl;a.download=arq.nome;a.click();
  }
  function saveContrato(){
    if(!f.empresa.trim()){alert('Informe a empresa contratada.');return;}
    onSaveContrato({...proc,contrato:f});
    setProcessos(prev=>prev.map(x=>x.id===proc.id?{...x,contrato:f}:x));
  }
  const TABS=[
    {id:'info',l:'Detalhes',n:'file'},
    {id:'contrato',l:'Contrato',n:'clip'},
    {id:'anexos',l:'Documentos ('+(proc.anexos||[]).length+')',n:'ul'},
  ];
  const g2={display:'grid',gridTemplateColumns:'1fr 1fr',gap:12};
  const g3={display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12};
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
      <SAv id={proc.secretaria_id} size={44}/>
      <div style={{flex:1}}>
        <span style={{fontFamily:'monospace',fontWeight:900,color:'#1a3a6e',fontSize:12}}>{proc.numero}</span>
        <p style={{fontSize:14,fontWeight:800,color:'var(--txt)',lineHeight:1.3}}>{proc.assunto}</p>
        <p style={{fontSize:11,color:'var(--muted)'}}>{sec.nome}</p>
      </div>
    </div>
    <div style={{display:'flex',gap:6,flexWrap:'wrap'}}>
      <span style={{color:st.cor,background:st.cor+'18',border:'1px solid '+st.cor+'33',padding:'3px 9px',borderRadius:999,fontSize:10,fontWeight:700}}>{st.l}</span>
      {proc.valor_estimado&&<span style={{color:'#059669',background:'#f0fdf4',border:'1px solid #86efac',padding:'3px 9px',borderRadius:999,fontSize:10,fontWeight:700}}>Est: {fR(proc.valor_estimado)}</span>}
      {proc.valor_final&&<span style={{color:'#0369a1',background:'#eff6ff',border:'1px solid #bfdbfe',padding:'3px 9px',borderRadius:999,fontSize:10,fontWeight:800}}>Final: {fR(proc.valor_final)}</span>}
    </div>
    <div style={{display:'flex',borderBottom:'1px solid var(--brd)'}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{flex:1,padding:'9px 4px',fontSize:10,fontWeight:700,border:'none',background:'transparent',cursor:'pointer',fontFamily:'inherit',color:tab===t.id?'#1a3a6e':'var(--muted)',borderBottom:tab===t.id?'2px solid #1a3a6e':'2px solid transparent',marginBottom:-1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}}><Ic n={t.n} z={13} c={tab===t.id?'#1a3a6e':undefined}/>{t.l}</button>)}
    </div>

    {tab==='info'&&<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:7}}>
      {[['Modalidade',MOD[proc.modalidade]||proc.modalidade],['Responsável',proc.responsavel||'--'],['Data Abertura',fD(proc.data_abertura)],['Previsão',fD(proc.data_prevista)],['Valor Estimado',fR(proc.valor_estimado)],['Valor Final',proc.valor_final?fR(proc.valor_final):'Não informado']].map(([k,v])=><div key={k} style={{background:'var(--inp)',borderRadius:9,padding:'9px 11px'}}><p style={{fontSize:9,color:'var(--muted)',fontWeight:800,textTransform:'uppercase',marginBottom:3}}>{k}</p><p style={{fontSize:12,fontWeight:700,color:'var(--txt)'}}>{v}</p></div>)}
      <div style={{display:'flex',gap:10,marginTop:6,gridColumn:'1/-1'}}><PB onClick={()=>onEdit(proc)} full color="#1a3a6e"><Ic n="edit" z={14}/>Editar Processo</PB><PB onClick={onClose} outline>Fechar</PB></div>
    </div>}

    {tab==='contrato'&&<div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div style={{background:'linear-gradient(135deg,#0d2a4a,#1a3a6e)',borderRadius:12,padding:'13px 16px',color:'#fff',display:'flex',alignItems:'center',gap:10}}>
        <Ic n="clip" z={18} c="rgba(255,255,255,.85)"/>
        <div><p style={{fontSize:11,opacity:.8}}>Contrato vinculado ao processo</p><p style={{fontSize:13,fontWeight:800}}>{proc.numero} — {proc.assunto.slice(0,45)}</p></div>
      </div>
      <div style={{border:'1px solid var(--brd)',borderRadius:12,padding:'14px 16px'}}>
        <p style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:12}}>📄 Arquivos do Contrato (PDF) — pode anexar mais de um</p>
        {f.arquivos.map((arq,i)=>(
          <div key={arq.id||i} style={{display:'flex',alignItems:'center',gap:12,padding:'12px 14px',background:'#f0fdf4',border:'1.5px solid #86efac',borderRadius:10,marginBottom:8}}>
            <div style={{width:42,height:42,borderRadius:9,background:'#dc262618',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><span style={{fontSize:11,fontWeight:900,color:'#dc2626'}}>PDF</span></div>
            <div style={{flex:1,minWidth:0}}>
              <p style={{fontSize:13,fontWeight:800,color:'var(--txt)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{arq.nome}</p>
              <p style={{fontSize:11,color:'var(--muted)'}}>{fKB(arq.tamanho)} · Anexado em {fD(arq.data)}</p>
            </div>
            <button onClick={()=>{if(arq.dataUrl){try{const b64=arq.dataUrl.split(',')[1];const bytes=atob(b64);const arr=new Uint8Array(bytes.length);for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);const blob=new Blob([arr],{type:'application/pdf'});const url=URL.createObjectURL(blob);window.open(url,'_blank');}catch(e){const a=document.createElement('a');a.href=arq.dataUrl;a.download=arq.nome;a.click();}}else{alert('Arquivo não disponível.');}}} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 12px',background:'#0369a1',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,flexShrink:0,whiteSpace:'nowrap'}}><Ic n="eye" z={13} c="#fff"/>Ver</button>
            <button onClick={()=>downloadArq(arq)} style={{display:'flex',alignItems:'center',gap:5,padding:'7px 12px',background:'#059669',color:'#fff',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,flexShrink:0,whiteSpace:'nowrap'}}><Ic n="dl" z={13} c="#fff"/>Baixar</button>
            <IB icon="trash" color="#dc2626" title="Remover" onClick={()=>up('arquivos',f.arquivos.filter((_,j)=>j!==i))} sm/>
          </div>
        ))}
        <div onClick={()=>fileRef.current.click()} style={{border:'2px dashed #1a3a6e',borderRadius:10,padding:'20px 16px',textAlign:'center',cursor:'pointer',background:'#e8eef7',marginTop:4,transition:'all .2s'}} onMouseEnter={e=>{e.currentTarget.style.background='#dbeafe';e.currentTarget.style.borderColor='#0d2a4a';}} onMouseLeave={e=>{e.currentTarget.style.background='#e8eef7';e.currentTarget.style.borderColor='#1a3a6e';}}>
          <Ic n="ul" z={22} c="#1a3a6e" sx={{margin:'0 auto 8px'}}/>
          <p style={{fontSize:13,fontWeight:800,color:'#1a3a6e'}}>Clique para adicionar {f.arquivos.length>0?'mais um contrato':'o contrato em PDF'}</p>
          <p style={{fontSize:11,color:'#1a3a6e',marginTop:3}}>Você pode anexar múltiplos arquivos PDF</p>
        </div>
        <input ref={fileRef} type="file" accept=".pdf,application/pdf" multiple style={{display:'none'}} onChange={pickPDFs}/>
      </div>
      <div style={{border:'1px solid var(--brd)',borderRadius:12,padding:'14px 16px'}}>
        <p style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:12}}>Dados do Contrato</p>
        <div style={g3}>
          <Fld label="Número do Contrato"><input style={IS} value={f.numero_contrato} placeholder="CONT-2025-001" onFocus={oF} onBlur={oB} onChange={e=>up('numero_contrato',e.target.value)}/></Fld>
          <Fld label="Data de Assinatura"><input type="date" style={IS} value={f.data_assinatura} onFocus={oF} onBlur={oB} onChange={e=>up('data_assinatura',e.target.value)}/></Fld>
          <Fld label="Data de Vigência"><input type="date" style={IS} value={f.data_vigencia} onFocus={oF} onBlur={oB} onChange={e=>up('data_vigencia',e.target.value)}/></Fld>
        </div>
        <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
          <Fld label="Objeto do Contrato"><input style={IS} value={f.objeto} onFocus={oF} onBlur={oB} onChange={e=>up('objeto',e.target.value)}/></Fld>
          <Fld label="Valor do Contrato (R$)"><input style={IS} type="number" value={f.valor} placeholder="0,00" onFocus={oF} onBlur={oB} onChange={e=>up('valor',e.target.value)}/></Fld>
        </div>
      </div>
      <div style={{border:'1px solid var(--brd)',borderRadius:12,padding:'14px 16px'}}>
        <p style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:12}}>Empresa Contratada</p>
        <div style={g2}>
          <Fld label="Razão Social" req><input style={IS} value={f.empresa} placeholder="Nome da empresa" onFocus={oF} onBlur={oB} onChange={e=>up('empresa',e.target.value)}/></Fld>
          <Fld label="CNPJ"><input style={IS} value={f.cnpj} placeholder="00.000.000/0001-00" onFocus={oF} onBlur={oB} onChange={e=>up('cnpj',e.target.value)}/></Fld>
        </div>
        <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
          <Fld label="Responsável / Rep. Legal"><input style={IS} value={f.responsavel} placeholder="Nome do responsável" onFocus={oF} onBlur={oB} onChange={e=>up('responsavel',e.target.value)}/></Fld>
          <Fld label="E-mail"><input type="email" style={IS} value={f.email} placeholder="contato@empresa.com.br" onFocus={oF} onBlur={oB} onChange={e=>up('email',e.target.value)}/></Fld>
          <Fld label="Telefone"><input style={IS} value={f.telefone} placeholder="(00) 00000-0000" onFocus={oF} onBlur={oB} onChange={e=>up('telefone',e.target.value)}/></Fld>
        </div>
      </div>
      <Fld label="Observações"><textarea style={{...IS,resize:'none'}} rows={3} value={f.obs} placeholder="Observações sobre o contrato..." onFocus={oF} onBlur={oB} onChange={e=>up('obs',e.target.value)}/></Fld>
      <div style={{display:'flex',gap:10}}><PB onClick={saveContrato} color={NAVY} full><Ic n="check" z={14}/>Salvar Contrato</PB><PB onClick={onClose} outline>Fechar</PB></div>
    </div>}

    {tab==='anexos'&&<div style={{display:'flex',flexDirection:'column',gap:10}}>
      <div style={{background:GB,border:'1.5px solid '+GD,borderRadius:10,padding:'10px 13px',display:'flex',alignItems:'center',gap:9}}>
        <Ic n="folder" z={15} c={G}/>
        <p style={{fontSize:11,fontWeight:700,color:G}}>Pasta: Processos / {proc.numero}</p>
      </div>
      <DropZone onFiles={files=>{const reads=files.map(fl=>new Promise(res=>{const r=new FileReader();r.onload=e=>res({id:uid(),nome:fl.name,tamanho:fl.size,data:td(),dataUrl:e.target.result});r.readAsDataURL(fl);}));Promise.all(reads).then(n=>{setProcessos(prev=>prev.map(x=>x.id===proc.id?{...x,anexos:[...(x.anexos||[]),...n]}:x));});}}/>
      {(proc.anexos||[]).length===0&&<p style={{fontSize:12,color:'var(--muted)',textAlign:'center',padding:16}}>Nenhum documento anexado.</p>}
      {(proc.anexos||[]).map(a=><ARow key={a.id} a={a} onDelete={id=>{setProcessos(prev=>prev.map(x=>x.id===proc.id?{...x,anexos:(x.anexos||[]).filter(an=>an.id!==id)}:x));}}/>)}
      <PB onClick={onClose} outline>Fechar</PB>
    </div>}

  </div>;
}

function ProcessosPage({processos,setProcessos,addLog,toast}){
  const mob=useMob();
  const[modal,setModal]=useState(null);const[sel,setSel]=useState(null);
  const[detProc,setDetProc]=useState(null);
  const[q,setQ]=useState('');const[fSec,setFSec]=useState('');
  const filtered=processos.filter(p=>{const sq=q.toLowerCase();return(!q||p.numero.toLowerCase().includes(sq)||p.assunto.toLowerCase().includes(sq))&&(!fSec||p.secretaria_id===Number(fSec));});
  function save(data){setProcessos(p=>{const e=p.find(x=>x.id===data.id);return e?p.map(x=>x.id===data.id?data:x):[data,...p];});toast(modal==='new'?'Cadastrado!':'Atualizado!','success');setModal(null);setSel(null);}
  function saveContrato(data){setProcessos(p=>p.map(x=>x.id===data.id?data:x));setDetProc(null);toast('Contrato salvo!','success');}
  function del(id){if(!confirm('Excluir?'))return;setProcessos(prev=>prev.filter(x=>x.id!==id));toast('Excluído.','info');}
  function PlForm({ini,pls,onSave,onClose}){
    const nxt='PL-'+new Date().getFullYear()+'-'+String(pls.length+1).padStart(4,'0');
    const[f,sf]=useState(ini||{numero:nxt,secretaria_id:1,modalidade:'pregao_eletronico',assunto:'',status:'solicitado',data_abertura:td(),data_prevista:'',responsavel:'',valor_estimado:'',valor_final:'',obs:'',anexos:[],contrato:null});
    const up=(k,v)=>sf(p=>({...p,[k]:v}));
    function sv(){if(!f.assunto.trim()){alert('Preencha o assunto.');return;}var payload=Object.assign(Object.assign({},f),{secretaria_id:Number(f.secretaria_id)});if(f.id)payload.id=f.id;onSave(payload);} 
    return <div style={{display:'flex',flexDirection:'column',gap:13}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Fld label="Número"><input style={IS} value={f.numero} readOnly={!!ini} onFocus={oF} onBlur={oB} onChange={e=>up('numero',e.target.value)}/></Fld>
        <Fld label="Secretaria"><select style={IS} value={f.secretaria_id} onFocus={oF} onBlur={oB} onChange={e=>up('secretaria_id',e.target.value)}>{SECS.map(s=><option key={s.id} value={s.id}>{s.nome}</option>)}</select></Fld>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Fld label="Modalidade"><select style={IS} value={f.modalidade} onFocus={oF} onBlur={oB} onChange={e=>up('modalidade',e.target.value)}>{Object.entries(MOD).map(([v,l])=><option key={v} value={v}>{l}</option>)}</select></Fld>
        <Fld label="Status"><select style={IS} value={f.status} onFocus={oF} onBlur={oB} onChange={e=>up('status',e.target.value)}>{SPL.map(s=><option key={s.v} value={s.v}>{s.l}</option>)}</select></Fld>
      </div>
      <Fld label="Assunto / Objeto" req><input style={IS} value={f.assunto} onFocus={oF} onBlur={oB} onChange={e=>up('assunto',e.target.value)}/></Fld>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
        <Fld label="Abertura"><input type="date" style={IS} value={f.data_abertura} onFocus={oF} onBlur={oB} onChange={e=>up('data_abertura',e.target.value)}/></Fld>
        <Fld label="Previsão"><input type="date" style={IS} value={f.data_prevista} onFocus={oF} onBlur={oB} onChange={e=>up('data_prevista',e.target.value)}/></Fld>
        <Fld label="Responsável"><input style={IS} value={f.responsavel} onFocus={oF} onBlur={oB} onChange={e=>up('responsavel',e.target.value)}/></Fld>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <Fld label="Valor Estimado (R$)"><input style={IS} type="number" value={f.valor_estimado} placeholder="0,00" onFocus={oF} onBlur={oB} onChange={e=>up('valor_estimado',e.target.value)}/></Fld>
        <Fld label="Valor Final (R$)"><input style={IS} type="number" value={f.valor_final||''} placeholder="0,00 — após homologação" onFocus={oF} onBlur={oB} onChange={e=>up('valor_final',e.target.value)}/></Fld>
      </div>
      <div style={{border:'1px solid var(--brd)',borderRadius:12,padding:'12px 14px'}}>
        <p style={{fontSize:10,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',marginBottom:10}}>Documentos do Processo</p>
        <div style={{background:GB,border:'1.5px solid '+GD,borderRadius:10,padding:'10px 13px',display:'flex',alignItems:'center',gap:9,marginBottom:10}}><Ic n="folder" z={15} c={G}/><p style={{fontSize:11,fontWeight:700,color:G}}>Pasta: Processos / {f.numero}</p></div>
        <DropZone onFiles={files=>{const reads=files.map(fl=>new Promise(res=>{const r=new FileReader();r.onload=e=>res({id:uid(),nome:fl.name,tamanho:fl.size,data:td(),dataUrl:e.target.result});r.readAsDataURL(fl);}));Promise.all(reads).then(n=>up('anexos',[...(f.anexos||[]),...n]));}}/>
        {(f.anexos||[]).map(a=><ARow key={a.id} a={a} onDelete={id=>up('anexos',(f.anexos||[]).filter(x=>x.id!==id))}/>)}
      </div>
      <div style={{display:'flex',gap:10}}><PB onClick={sv} color={NAVY} full>{!ini?'Cadastrar':'Salvar'}</PB><PB onClick={onClose} outline>Cancelar</PB></div>
    </div>;
  }
  const th={padding:'10px 14px',textAlign:'left',fontSize:9,fontWeight:800,color:'var(--muted)',textTransform:'uppercase',letterSpacing:'.06em',whiteSpace:'nowrap'};
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <div style={{flex:1,minWidth:180,position:'relative'}}><div style={{position:'absolute',left:11,top:'50%',transform:'translateY(-50%)',color:'var(--muted)',pointerEvents:'none'}}><Ic n="search" z={15}/></div><input style={{...IS,paddingLeft:35}} placeholder="Buscar..." value={q} onChange={e=>setQ(e.target.value)} onFocus={oF} onBlur={oB}/></div>
      <select style={{...IS,width:140,fontSize:12,padding:'9px 10px'}} value={fSec} onChange={e=>setFSec(e.target.value)}><option value="">Secretarias</option>{SECS.map(s=><option key={s.id} value={s.id}>{s.sigla}</option>)}</select>
      <button onClick={()=>{setSel(null);setModal('new');}} style={{display:'flex',alignItems:'center',gap:7,background:NAVY,color:'#fff',fontWeight:800,padding:'9px 15px',borderRadius:9,border:'none',cursor:'pointer',fontSize:13,fontFamily:'inherit',whiteSpace:'nowrap'}}><Ic n="plus" z={15} c="#fff"/>{!mob&&'Novo Processo'}</button>
    </div>
    <Card style={{overflow:'hidden'}}><div style={{overflowX:'auto'}}><table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
      <thead><tr style={{borderBottom:'1.5px solid var(--brd)',background:'var(--inp)'}}>{['Número','Secretaria','Assunto','Modalidade','Responsável','Valor Est.','Valor Final','Status','Contrato','Ações'].map(h=><th key={h} style={th}>{h}</th>)}</tr></thead>
      <tbody>
        {filtered.length===0&&<tr><td colSpan={10} style={{padding:'40px 14px',textAlign:'center',color:'var(--muted)',fontSize:13}}>Nenhum processo.</td></tr>}
        {filtered.map(p=>{const sec=gS(p.secretaria_id);const st=gT(SPL,p.status);return <tr key={p.id} style={{borderBottom:'1px solid var(--brd)',transition:'background .1s'}} onMouseEnter={e=>e.currentTarget.style.background='var(--hov)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
          <td style={{padding:'10px 14px',fontFamily:'monospace',fontWeight:800,color:'#1a3a6e',fontSize:11,whiteSpace:'nowrap'}}>{p.numero}</td>
          <td style={{padding:'10px 14px'}}><SAv id={p.secretaria_id} size={24}/></td>
          <td style={{padding:'10px 14px',maxWidth:200}}><p style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:600,color:'var(--txt)'}}>{p.assunto}</p></td>
          <td style={{padding:'10px 14px',fontSize:11,color:'var(--muted)',whiteSpace:'nowrap'}}>{MOD[p.modalidade]||p.modalidade}</td>
          <td style={{padding:'10px 14px',fontSize:11,color:'var(--muted)',whiteSpace:'nowrap'}}>{p.responsavel||'--'}</td>
          <td style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:'#059669',whiteSpace:'nowrap'}}>{fR(p.valor_estimado)}</td>
              <td style={{padding:'10px 14px',fontSize:11,fontWeight:700,color:'#0369a1',whiteSpace:'nowrap'}}>{p.valor_final?fR(p.valor_final):<span style={{color:'var(--muted)'}}>--</span>}</td>
          <td style={{padding:'10px 14px',whiteSpace:'nowrap'}}><span style={{color:st.cor,background:st.cor+'18',border:'1px solid '+st.cor+'33',padding:'2px 8px',borderRadius:999,fontSize:9,fontWeight:700,display:'inline-block'}}>{st.l}</span></td>
              <td style={{padding:'10px 14px',textAlign:'center'}}>{p.contrato&&p.contrato.empresa?<span style={{fontSize:10,color:'#059669',background:'#f0fdf4',border:'1px solid #86efac',padding:'2px 8px',borderRadius:999,fontWeight:700,display:'inline-flex',alignItems:'center',gap:4}}><Ic n="check" z={10} c="#059669"/>Vinculado</span>:<span style={{fontSize:10,color:'#dc2626',background:'#fef2f2',border:'1px solid #fecaca',padding:'2px 8px',borderRadius:999,fontWeight:700}}>Sem contrato</span>}</td>
              <td style={{padding:'10px 14px'}}><div style={{display:'flex',gap:4,alignItems:'center'}}>
                <button onClick={()=>setDetProc(p)} style={{display:'flex',alignItems:'center',gap:5,padding:'5px 10px',background:NAVY,color:'#fff',border:'none',borderRadius:7,cursor:'pointer',fontSize:11,fontWeight:800,fontFamily:'inherit',whiteSpace:'nowrap'}}>
                  <Ic n="clip" z={12} c="#fff"/>Contrato
                </button>
                <IB icon="edit" color="#d97706" title="Editar" onClick={()=>{setSel(p);setModal('edit');}} sm/>
                <IB icon="trash" color="#dc2626" title="Excluir" onClick={()=>del(p.id)} sm/>
              </div></td>
        </tr>;})}
      </tbody>
    </table></div></Card>
    {(modal==='new'||modal==='edit')&&<Modal title={modal==='new'?'Novo Processo':'Editar Processo'} onClose={()=>setModal(null)} wide><PlForm ini={modal==='edit'?sel:null} pls={processos} onSave={save} onClose={()=>setModal(null)}/></Modal>}

  const alertCount=oficios.filter(o=>(isOv(o.prazo)||isSn(o.prazo)||o.status==='pendente')&&!['concluido','arquivado'].includes(o.status)).length;
  const TITLES={dashboard:'Dashboard',oficios:'Controle de Ofícios',processos:'Processos Licitatórios',pesquisas:'Pesquisas de Preço',secretarias:'Secretarias',alertas:'Alertas',relatórios:'Relatórios',usuarios:'Usuários',logs:'Logs do Sistema'};
  const C=dark?{'--bg':'#081a0e','--card':'#0d2618','--brd':'#1a3d2a','--txt':'#e8f5ec','--muted':'#7aab8a','--inp':'#081a0e','--hov':'#1a3d2a','--sb':'#040e07','--sbf':'#d1fae5','--sbb':'#1a5c38'}:{'--bg':'#f0f4f1','--card':'#ffffff','--brd':'#d4e8d9','--txt':'#0a1f10','--muted':'#4a6155','--inp':'#f5f9f6','--hov':'#e8f5ec','--sb':'#0d3d22','--sbf':'#d1fae5','--sbb':'#1a5c38'};
  useEffect(()=>{const root=document.documentElement;Object.entries(C).forEach(([k,v])=>root.style.setProperty(k,v));},[dark]);
  if(!loggedIn)return <LoginPage onLogin={()=>setLoggedIn(true)}/>;
  const NAV=[{id:'dashboard',l:'Dashboard',icon:'dashboard'},{id:'oficios',l:'Ofícios',icon:'file'},{id:'processos',l:'Processos Licit.',icon:'gavel'},{id:'pesquisas',l:'Pesquisas de Preço',icon:'check_sq'},{id:'secretarias',l:'Secretarias',icon:'building'},{id:'alertas',l:'Alertas',icon:'bell',badge:alertCount},{id:'relatórios',l:'Relatórios',icon:'rep'},{id:'usuarios',l:'Usuários',icon:'users'},{id:'logs',l:'Logs',icon:'log'}];

  function SideContent({mini,mobile}){
    return <>
      <div style={{padding:'13px 11px',borderBottom:'1px solid var(--sbb)',display:'flex',alignItems:'center',gap:10}}>
        <div style={{width:34,height:34,borderRadius:9,background:'linear-gradient(135deg,#1a5c38,#2d8f5e)',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}><Ic n="building" z={17} c="#fff"/></div>
        {(!mini||mobile)&&<div style={{minWidth:0}}><p style={{fontSize:12,fontWeight:900,color:'#4ade80',lineHeight:1.1}}>SIGCOMP</p><p style={{fontSize:9,color:'var(--sbf)',opacity:.5,fontWeight:700}}>GAMELEIRA · PE</p></div>}
        {mobile&&<button onClick={()=>setMobMenu(false)} style={{marginLeft:'auto',border:'none',background:'transparent',cursor:'pointer',color:'var(--sbf)',opacity:.5,display:'flex'}}><Ic n="x" z={18}/></button>}
        {!mini&&!mobile&&<button onClick={()=>setSideOpen(false)} style={{marginLeft:'auto',width:26,height:26,borderRadius:6,border:'none',background:'transparent',cursor:'pointer',color:'var(--sbf)',opacity:.4,display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="chevL" z={15}/></button>}
      </div>
      <nav style={{flex:1,padding:'9px 7px',display:'flex',flexDirection:'column',gap:2,overflowY:'auto'}}>
        {NAV.map(item=>{const active=page===item.id;return <button key={item.id} onClick={()=>{setPage(item.id);if(mobile)setMobMenu(false);}} style={{display:'flex',alignItems:'center',gap:10,padding:(!mini||mobile)?'9px 10px':'9px',borderRadius:10,border:'none',cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,width:'100%',background:active?G2:'transparent',color:active?'#fff':'var(--sbf)',opacity:active?1:.65,justifyContent:(!mini||mobile)?'flex-start':'center',transition:'all .15s',textAlign:'left'}} onMouseEnter={e=>{if(!active){e.currentTarget.style.background='rgba(255,255,255,.08)';e.currentTarget.style.opacity='1';}}} onMouseLeave={e=>{if(!active){e.currentTarget.style.background='transparent';e.currentTarget.style.opacity='.65';}}}>
          <div style={{position:'relative',flexShrink:0}}><Ic n={item.icon} z={17}/>{item.badge>0&&<span style={{position:'absolute',top:-5,right:-5,width:13,height:13,background:'#dc2626',color:'#fff',borderRadius:'50%',fontSize:7,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900}}>{item.badge>9?'9+':item.badge}</span>}</div>
          {(!mini||mobile)&&<span style={{flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.l}</span>}
        </button>;})}
      </nav>
      <div style={{padding:'9px 7px',borderTop:'1px solid var(--sbb)',display:'flex',flexDirection:'column',gap:2}}>
        <button onClick={()=>setDark(v=>!v)} style={{display:'flex',alignItems:'center',gap:10,padding:(!mini||mobile)?'9px 10px':'9px',borderRadius:10,border:'none',background:'transparent',cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,color:'var(--sbf)',opacity:.5,width:'100%',justifyContent:(!mini||mobile)?'flex-start':'center'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(255,255,255,.08)';e.currentTarget.style.opacity='1';}} onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.opacity='.5';}}><Ic n={dark?'sun':'moon'} z={16}/>{(!mini||mobile)&&(dark?'Modo Claro':'Modo Escuro')}</button>
        <button onClick={()=>setLoggedIn(false)} style={{display:'flex',alignItems:'center',gap:10,padding:(!mini||mobile)?'9px 10px':'9px',borderRadius:10,border:'none',background:'transparent',cursor:'pointer',fontFamily:'inherit',fontSize:12,fontWeight:700,color:'#fca5a5',opacity:.8,width:'100%',justifyContent:(!mini||mobile)?'flex-start':'center'}} onMouseEnter={e=>{e.currentTarget.style.background='rgba(220,38,38,.15)';e.currentTarget.style.opacity='1';}} onMouseLeave={e=>{e.currentTarget.style.background='transparent';e.currentTarget.style.opacity='.8';}}><Ic n="logout" z={16} c="#fca5a5"/>{(!mini||mobile)&&'Sair'}</button>
      </div>
    </>;
  }

  return <div style={{fontFamily:'system-ui,sans-serif',display:'flex',height:'100dvh',overflow:'hidden',background:'var(--bg)',...C}}>
    {mobMenu&&<div onClick={()=>setMobMenu(false)} style={{position:'fixed',inset:0,zIndex:40,background:'rgba(0,0,0,.5)'}}/>}
    {mob&&mobMenu&&<aside style={{position:'fixed',inset:'0 auto 0 0',width:256,background:'var(--sb)',display:'flex',flexDirection:'column',zIndex:50}}><SideContent mini={false} mobile={true}/></aside>}
    {!mob&&<aside style={{width:sideOpen?228:60,flexShrink:0,transition:'width .25s ease',background:'var(--sb)',borderRight:'1px solid var(--sbb)',display:'flex',flexDirection:'column',overflow:'hidden',zIndex:30}}><SideContent mini={!sideOpen} mobile={false}/></aside>}
    <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',minWidth:0}}>
      <header style={{flexShrink:0,background:'var(--card)',borderBottom:'1px solid var(--brd)',padding:'10px 16px',display:'flex',alignItems:'center',gap:12,zIndex:10}}>
        {mob&&<button onClick={()=>setMobMenu(true)} style={{padding:7,borderRadius:9,border:'none',background:'transparent',cursor:'pointer',color:'var(--muted)',display:'flex'}}><Ic n="menu" z={19}/></button>}
        {!mob&&!sideOpen&&<button onClick={()=>setSideOpen(true)} style={{padding:7,borderRadius:9,border:'none',background:'transparent',cursor:'pointer',color:'var(--muted)',display:'flex'}}><Ic n="chevR" z={18}/></button>}
        <div style={{flex:1,minWidth:0}}><h1 style={{fontSize:mob?13:15,fontWeight:900,color:'var(--txt)',lineHeight:1.2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{TITLES[page]||'SIGCOMP'}</h1>{!mob&&<p style={{fontSize:10,color:'var(--muted)'}}>Prefeitura Municipal de Gameleira - PE</p>}</div>
        <div style={{display:'flex',alignItems:'center',gap:9,flexShrink:0}}>
          {mob&&<button onClick={()=>setDark(v=>!v)} style={{width:34,height:34,borderRadius:8,border:'1px solid var(--brd)',background:'var(--card)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n={dark?'sun':'moon'} z={15}/></button>}
          <div style={{width:34,height:34,borderRadius:10,background:'#e8f5ec',display:'flex',alignItems:'center',justifyContent:'center'}}><Ic n="person" z={17} c="#1a5c38"/></div>
          {!mob&&<button onClick={()=>setLoggedIn(false)} title="Sair" style={{width:34,height:34,borderRadius:9,border:'1.5px solid #fca5a544',background:'transparent',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#dc2626'}} onMouseEnter={e=>e.currentTarget.style.background='#dc262618'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}><Ic n="logout" z={16} c="#dc2626"/></button>}
        </div>
      </header>
      <main style={{flex:1,overflowY:'auto',padding:mob?'12px 11px':'18px 22px',paddingBottom:mob?'74px':'18px'}}>
        <div style={{animation:'fadeUp .3s ease both',maxWidth:1400,margin:'0 auto'}}>
          {page==='dashboard'&&<Dashboard oficios={oficios} processos={processos} pesquisas={pesquisas}/>}
          {page==='oficios'&&<OficiosPage oficios={oficios} setOficios={setOficios} addLog={addLog} toast={toast}/>}
          {page==='processos'&&<ProcessosPage processos={processos} setProcessos={setProcessos} addLog={addLog} toast={toast}/>}
          {page==='pesquisas'&&<PesquisasPage oficios={oficios} pesquisas={pesquisas} setPesquisas={setPesquisas} addLog={addLog} toast={toast}/>}
          {page==='secretarias'&&<SecretariasPage oficios={oficios} processos={processos}/>}
          {page==='alertas'&&<AlertasPage oficios={oficios}/>}
          {page==='relatórios'&&<RelatoriosPage oficios={oficios} processos={processos} pesquisas={pesquisas} toast={toast}/>}
          {page==='usuarios'&&<UsuariosPage usuarios={usuarios} setUsuarios={setUsuarios} toast={toast}/>}
          {page==='logs'&&<LogsPage logs={logs}/>}
        </div>
      </main>
    </div>
    {mob&&<BottomNav page={page} setPage={setPage} alertCount={alertCount}/>}
    {toastData&&<Toast msg={toastData.msg} type={toastData.type} onDone={()=>setToastData(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
